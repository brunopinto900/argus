# Scenario: Cold-Start Acquisition -- the drone starts with its yaw offset
# 70 degrees from the hitch goal point's default heading (see
# examples/online_mapping_demo.cpp's 'initial_yaw_deg', added for this
# scenario), so the target starts OUTSIDE the +/-40 deg FOV cone instead of
# every other scenario's implicit dead-ahead start. Tests real initial
# acquisition behavior -- compute_metrics.py's initial_acquisition_latency_s
# has never actually been exercised before this, every prior scenario
# starts with it at 0.0 by construction. No obstacles -- isolates
# acquisition from avoidance, same convention as stop_and_go.yaml.
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
initial_yaw_deg: 70.0

obstacles: []

leader:
  t_end: 10.0
  waypoints:
    - [0.0, -6.0]
    - [0.0, 6.0]
  speed_profile:
    - [0.0, 0.0]      # start at rest
    - [1.5, 1.6]      # accelerate to cruise
    - [8.5, 1.6]
    - [10.0, 0.0]     # stop

# Scenario: Near-Miss Cascade -- several obstacles requiring back-to-back
# dodges in quick succession, with little recovery distance between them
# (unlike forest.yaml's more generously spaced obstacles), all at cruise
# speed with no slowdown. Tests whether one dodge's transient has settled
# before the next one hits.
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
obstacles:
  - shape: circle
    center: [0.8, -2.0]
    radius: 0.5
  - shape: circle
    center: [-0.8, -0.8]
    radius: 0.5
  - shape: circle
    center: [0.8, 0.4]
    radius: 0.5
  - shape: circle
    center: [-0.8, 1.6]
    radius: 0.5

leader:
  t_end: 12.0
  waypoints:
    - [0.0, -6.0]
    - [0.0, -3.0]
    - [-0.6, -2.0]   # dodge left of obstacle 1
    - [0.6, -0.8]    # dodge right of obstacle 2
    - [-0.6, 0.4]    # dodge left of obstacle 3
    - [0.6, 1.6]     # dodge right of obstacle 4
    - [0.0, 3.0]
    - [0.0, 6.0]
  speed_profile:
    - [0.0, 0.0]      # start at rest
    - [1.3, 1.4]      # accelerate to cruise
    - [10.0, 1.4]     # cruise through the whole cascade, no slowdown
    - [11.0, 0.4]
    - [12.0, 0.0]     # stop

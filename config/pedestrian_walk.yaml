# Scenario: Pedestrian Walk -- a single continuous clip chaining several
# human motion primitives in sequence (walk, full stop, lateral sidestep,
# small twist, walk again) amid irregular clutter, the way an actual
# Skydio-style demo cut looks, rather than isolating one stressor the way
# every other curated scenario does. Replaces street_corridor.yaml, whose
# results never distinguished themselves from the rest of the suite.
#
# Tests whether tracking/standoff/FOV stay coherent across a chain of
# different behaviors and their transitions -- something no single-event
# scenario can reveal, since the interesting part here is what happens
# AT each transition (stop->sidestep, sidestep->walk, walk->twist), not
# any one phase in isolation.
#
# The path's shape (waypoints) and its pacing (speed_profile) are
# independent -- a "stop" is just speed=0 for an interval while the
# position parameter holds, same mechanism as stop_and_go.yaml.
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
obstacles:
  - shape: circle
    center: [-0.9, -2.3]
    radius: 0.3            # near the stop point
  - shape: circle
    center: [0.0, -0.8]
    radius: 0.35           # motivates the sidestep: sits where going straight would have hit it
  - shape: square
    center: [2.4, 0.0]
    half_size: 0.3          # passive clutter along the post-sidestep walk
  - shape: circle
    center: [2.1, 2.0]
    radius: 0.3            # near the twist, motivating the turn back toward centerline
  - shape: square
    center: [-1.0, 5.0]
    half_size: 0.35          # passive clutter near the end

leader:
  t_end: 17.0
  waypoints:
    - [0.0, -6.0]
    - [0.0, -2.0]    # walk-in / stop vicinity
    - [1.6, -1.8]    # lateral sidestep -- mostly x, barely any y, unlike every other scenario's forward-biased dodges
    - [1.6, 1.2]     # walk again, stepped-over position
    - [0.3, 3.4]     # small twist -- a modest ~25 deg bend, not a hard corner
    - [0.0, 6.0]
    - [0.0, 8.5]
  speed_profile:
    - [0.0, 0.0]      # start at rest
    - [1.5, 1.3]      # walk
    - [4.0, 1.3]
    - [4.8, 0.0]      # full stop
    - [6.3, 0.0]      # hold stopped
    - [7.1, 0.5]      # slow lateral creep -- the sidestep itself, done cautiously
    - [9.2, 0.5]
    - [10.0, 1.3]     # resume walking
    - [12.0, 1.3]
    - [12.8, 0.9]     # slow slightly into the twist
    - [14.3, 1.3]     # back to cruise after the twist
    - [15.5, 1.3]
    - [16.3, 0.3]
    - [17.0, 0.0]     # final stop

# Same as config/quadrotor_baseline_occ_tuned.yaml (x,y tracking stays on,
# p_cmd/q_cmd/r_cmd=15, r_elev=30, r_occ=20/10 on) but with the x,y,z
# term's z-weight zeroed (100 -> 0), so z has a single authority
# (r_elev's dynamic horiz_dist*tan(target_bearing) target) instead of
# fighting the x,y,z term's fixed kFovZRef target -- isolates whether the
# double z-authority bug (see the conversation) explains that config's
# nonzero FOV exceedance/reacquisition events.
#
# Measured on forest_clutter (config/forest.yaml), N=20, Ts=0.05:
#   collision_free:                True
#   min_clearance_true_m:          0.350  (with z=100: 0.350 -- identical)
#   body_rate_magnitude_max_deg_s: 86.45  (with z=100: 86.43 -- identical)
#   xy_tracking_error_mean_m:      0.0952 (with z=100: 0.0916)
#   occlusion_pct_mean:            62.61  (with z=100: 62.63 -- identical)
#   occlusion_pct_max:             82.14  (with z=100: 82.14 -- identical)
#   fov_exceedance_pct:            8.21   (with z=100: 8.57 -- barely moved)
#   reacquisition_events:          1      (with z=100: 1 -- identical)
#
# CONCLUSION: the double z-authority hypothesis is wrong. Removing it
# changed almost nothing -- the FOV exceedance/reacquisition in the
# z=100 version isn't caused by the fixed-kFovZRef-vs-dynamic-r_elev
# conflict. Something else (r_elev/r_occ pulling against r_fov/x,y
# directly, not specifically through z) is the actual cause -- not yet
# isolated. See the conversation.

model: {mass: 1.0, gravity: 9.81, Ix: 0.01, Iy: 0.01, Iz: 0.02}
mpc: {N: 20, Ts: 0.05, hover_altitude: 1.5}
constraints: {T_min: 0.0, T_max_factor: 2.0, rate_max: 3.8397, yaw_rate_max: 3.4907, angle_max_deg: 45.0,
  z_min: 0.3}
inner_loop: {tau_rp: 0.04, tau_yaw: 0.25}
cost:
  # layout: x,y,z, vx,vy,vz, phi,theta, p,q,r, r_fov, r_occ, r_dist, r_elev, r_azimuth, T, p_cmd,q_cmd,r_cmd
  W_stage: [100.0, 100.0, 0.0, 10.0, 10.0, 10.0, 5.0, 5.0, 5.0, 5.0, 5.0, 300.0, 20.0, 0.0, 30.0,
    0.0, 0.1, 15.0, 15.0, 15.0]
  # layout: x,y,z, vx,vy,vz, phi,theta, p,q,r, r_fov_e, r_occ_e, r_dist_e, r_elev_e, r_azimuth_e
  W_terminal: [200.0, 200.0, 0.0, 20.0, 20.0, 20.0, 10.0, 10.0, 10.0, 10.0, 10.0, 150.0, 10.0, 0.0,
    30.0, 0.0]
camera: {fov_half_angle_deg: 40.0, softplus_beta: 10.0}
plant: {wn_rp: 25.0, zeta_rp: 0.7, wn_yaw: 4.0, zeta_yaw: 0.7}
trailer: {distance_to_target: 2.0, heading_gain: 1.0, distance_mode: fixed, distance_min_m: 1.5, distance_max_m: 3.0,
  N: 20, Ts: 0.05, target_bearing_deg: 30.0}
mapping_sensor: {max_range_m: 8.0, num_rays: 1006, update_rate_hz: 60.0}
obstacle_avoidance: {mode: slack, d_safe_m: 0.32, slack_linear_weight: 10000.0, slack_quadratic_weight: 100.0}
occlusion_avoidance: {mode: cost, tau_occ_m: 1.68}

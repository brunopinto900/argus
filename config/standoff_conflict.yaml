# Scenario: Obstacle-Forces-Standoff-Conflict -- an obstacle sits on the
# path's centerline where the leader passes it with a dodge deliberately
# tighter than obstacle_avoidance.d_safe_m, so the drone's own 2m-behind
# standoff point -- which tracks close to the same corridor a beat later
# -- is forced into sustained tension between "hold the design standoff
# distance/bearing" and "respect the avoidance margin," rather than a
# single brief closest-approach moment like wall_slowdown.yaml.
#
# NOTE: the original dodge (clearance 0.3m) was a single-vertex C0 kink
# (same bug class as high_curvature.yaml's original zigzag) -- confirmed
# vector-accel spike of ~18 m/s^2 at tick resolution. Fixing that with
# scripts/test_motion_profile.py's round_waypoints() helper alone would
# have cut the real clearance to ~0.13m (rounding a corner cuts inside
# it), below the 0.27m hard safety gate -- so the dodge was widened from
# 0.8m to 1.5m offset first (clearance now 0.33m with rounding applied),
# trading some of the original "thin dodge" margin for a dodge that's
# actually physically executable at cruise speed. target_accel_abs_max
# dropped from 3.27 to ~1.00 m/s^2.
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
obstacles:
  - shape: circle
    center: [0.0, 4.0]
    radius: 0.5


# Scenario: Target Occlusion Cut -- the leader sidesteps a single obstacle
# sitting directly on an otherwise-straight path, at cruise speed (no
# deliberate slowdown, unlike wall_slowdown.yaml). Tests the occlusion
# metric itself (occlusion_clearance / occlusion_pct, see
# design_decisions.md's "Occlusion metric"): the follower's inherent lag
# behind a quick lateral waypoint change should momentarily put this
# obstacle on the drone->target bearing line even though the target itself
# is never behind it -- exactly the "obstacle cuts behind the target's
# path, briefly fouling the sightline" case the max-combined metric is
# meant to catch.
#
# NOTE: the original single-vertex sidestep was a true C0 kink (same bug
# class as high_curvature.yaml's original zigzag). Fixed with
# scripts/test_motion_profile.py's round_waypoints() helper -- densified
# the sidestep into an actual curve, then re-stretched the cruise segment
# to match the new path length. target_accel_abs_max dropped from 3.08 to
# ~0.87 m/s^2.
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
obstacles:
  - shape: circle
    center: [0.0, 4.0]
    radius: 0.5

leader:
  t_end: 13.8006
  waypoints:
    - [0.0000, -6.0000]
    - [0.0000, 2.2929]
    - [0.0062, 2.3711]
    - [0.0245, 2.4474]
    - [0.0545, 2.5199]
    - [0.0955, 2.5868]
    - [0.1464, 2.6464]
    - [1.1464, 3.6464]
    - [1.1974, 3.7061]
    - [1.2384, 3.7730]
    - [1.2684, 3.8455]
    - [1.2867, 3.9218]
    - [1.2929, 4.0000]
    - [1.2867, 4.0782]
    - [1.2684, 4.1545]
    - [1.2384, 4.2270]
    - [1.1974, 4.2939]
    - [1.1464, 4.3536]
    - [0.1464, 5.3536]
    - [0.0955, 5.4132]
    - [0.0545, 5.4801]
    - [0.0245, 5.5526]
    - [0.0062, 5.6289]
    - [0.0000, 5.7071]
    - [0.0000, 8.0000]
  # Cruise speed held through the sidestep -- no deliberate slowdown, so the
  # follower's lag relative to the leader's quick lateral move is what's
  # expected to create the momentary occlusion.
  speed_profile:
    - [0.0000, 0.0000]
    - [1.5000, 1.3000]
    - [10.3006, 1.3000]
    - [12.8006, 0.4000]
    - [13.8006, 0.0000]

# Scenario: Running Person -- the first scenario in this suite to leave
# walking pace. Every other scenario cruises at 1.0-2.0 m/s (normal
# walking, per standard pace tables); this one cruises at ~2.4 m/s,
# light-jogging pace. Deliberately isolates speed as the one new variable
# (mostly straight path, one gentle bend, moderate -- not tight -- obstacle
# clearance) rather than combining it with tight geometry, the way
# compound_stress combines a narrow gap with a sharp turn. See
# design_decisions.md's "Running Person" section for why this is treated
# as a diagnostic (expected to possibly fail, same or worse than the
# walking-pace scenarios) rather than a pass/fail expectation -- 7 of the
# other 14 scenarios already fail at walking pace, so a FAIL here isn't a
# new problem, it's confirmation the existing ones get worse at speed.
#
# No deliberate early slowdown: unlike wall_slowdown.yaml (which
# decelerates well before its obstacle on purpose), the speed_profile
# below holds jogging cruise straight through both obstacles and the
# bend -- a jogger doesn't necessarily ease off for something at a
# moderate clearance the way a cautious pedestrian would, and that
# contrast with wall_slowdown is the point.
#
# NOTE: target_accel_abs_max (2.40 m/s^2) is NOT a bug -- it's the
# deliberately quick accel-to-jogging-cruise ramp at t=0 (2.4 m/s over
# 1.0s), a realistic sprint-start acceleration, not cornering. The
# "gentle bend" vertex was a mild C0 kink (vector-accel ~6.6 m/s^2 at
# tick resolution); lightly rounded with
# scripts/test_motion_profile.py's round_waypoints() helper for
# consistency with the rest of the suite, though it wasn't driving the
# tracked metric.
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
obstacles:
  - shape: circle
    center: [1.6, 1.0]
    radius: 0.35
  - shape: circle
    center: [-0.3, 4.3]
    radius: 0.3

leader:
  t_end: 7.3492
  waypoints:
    - [0.0000, -6.0000]
    - [0.0000, -1.0393]
    - [0.0025, -1.0003]
    - [0.0101, -0.9620]
    - [0.7859, 1.9472]
    - [0.7951, 2.0004]
    - [0.7946, 2.0544]
    - [0.5010, 4.9902]
    - [0.4998, 5.0000]
    - [0.4984, 5.0097]
    - [0.0000, 8.0000]
  speed_profile:
    - [0.0000, 0.0000]
    - [1.0000, 2.4000]
    - [5.8492, 2.4000]
    - [6.6492, 0.5000]
    - [7.3492, 0.0000]

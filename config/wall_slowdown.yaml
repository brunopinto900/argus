# Scenario: Wall Slow-Down -- a single large obstacle directly on the
# straight-line path, forcing the leader to decelerate sharply on approach
# and creep past at close range before resuming cruise. Tests whether the
# MPC's obstacle-avoidance cost reacts early enough to a big, slow-closing
# obstacle (as opposed to forest.yaml's many small/fast-passing ones), and
# whether tracking/standoff degrade while the leader itself is slow.
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
obstacles:
  - shape: square
    center: [0.0, 3.0]
    half_size: 1.5          # 3m x 3m wall, centered on the straight path

leader:
  t_end: 14.0
  waypoints:
    - [0.0, -6.0]
    - [0.0, 0.5]    # approach, still south of the wall (wall spans y:[1.5,4.5])
    - [2.0, 1.0]     # move laterally out to x=2.0 before entering the wall's y-range
    - [2.0, 5.3]     # pass alongside the wall's edge (edge at x=1.5, 0.5m clearance)
    - [0.0, 6.0]     # return to centerline well past the wall, to avoid corner-cutting it
    - [0.0, 8.0]
  # Cruise, then slow sharply on approach, creep past at close range, then
  # back to cruise -- the deliberate deceleration this scenario exists to test.
  speed_profile:
    - [0.0, 0.0]     # start at rest
    - [1.5, 1.6]     # accelerate to cruise
    - [5.5, 1.6]     # cruise toward the wall
    - [6.5, 0.4]     # slow sharply on approach
    - [9.0, 0.4]     # creep past at close range
    - [10.0, 1.6]    # back to cruise after clearing
    - [13.0, 1.6]
    - [14.0, 0.0]    # stop

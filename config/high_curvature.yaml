# Scenario: Sustained High-Curvature Path -- a continuous sinusoidal weave
# with no obstacles, held at cruise speed throughout. sharp_corner.yaml
# tests one isolated heading-change event; this tests whether the
# controller's good single-event cornering also holds under continuous,
# repeated heading change, same isolation convention as stop_and_go.yaml
# (no obstacles, motion profile only).
#
# NOTE (rewritten): the original version of this scenario used ~8 sharp
# waypoint vertices (a zigzag, not an actual curve) to approximate an
# "S-curve". Since argus_follower::waypointTarget only does piecewise-
# LINEAR interpolation between waypoints before fitting a time spline
# (see design_decisions.md's "Motion-generator module is piecewise-linear
# geometry, not a real curve"), those sharp vertices were true C0 kinks:
# the leader's velocity vector reversed direction almost instantaneously
# (confirmed at actual control-tick resolution: vx flipped -1.52 -> 0.00
# -> +1.52 m/s within 2 ticks / 0.1s), producing a genuine ~30-80 m/s^2
# turning demand that the MPC really did see -- not a metric artifact.
#
# Fixed by replacing the zigzag with a densely-sampled (dy=0.1m) sine
# curve, x(y) = 1.5*sin(pi*(y+6)/4) -- i.e. amplitude 1.5m, ~1.08m turn
# radius at the tightest point. This geometry is what the module needs to
# actually approximate a smooth curve with its piecewise-linear
# interpolation; convergence was checked at dy=0.5/0.25/0.1/0.05 before
# settling on dy=0.1 (141 points) as adequate (sustained vector-accel max
# converges to ~2.1-2.4 m/s^2, matching the curve's analytic curvature
# bound v^2/r = 1.5^2/1.08 ~= 2.1 m/s^2 -- a plausible sustained cornering
# demand for a brisk pedestrian weave, vs. the original's spurious 82
# m/s^2 single-point spike).
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
obstacles: []

leader:
  # NOTE: speed_profile's time-integral must match waypoints' total path
  # length (18.02m here) -- see stop_and_go.yaml's comment and
  # design_decisions.md's "Path-length / speed-profile mismatch".

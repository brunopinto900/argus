# Scenario for examples/online_mapping_demo.cpp: a forest-like ground-truth
# obstacle layout (hand-authored, not procedural/Monte Carlo -- a
# deliberate mix of small/"twig" and medium/"trunk" obstacles plus one
# narrow passage) and a leader path hand-threaded through it. See
# design_decisions.md. One of possibly several scenario files -- pass a
# different one as the demo's first CLI arg (default: this file).
#
# Once Gazebo supplies real point clouds into this same VoxelGrid pipeline
# (VoxelGrid::insertPointCloud()), the obstacles: section's role shrinks to
# "standalone testbed without Gazebo running" -- not throwaway, since the
# consuming interface (a point cloud) doesn't change.
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
obstacles:
  - shape: circle
    center: [-1.0, -5.0]
    radius: 0.2          # small tree

  - shape: circle
    center: [1.0, -4.0]
    radius: 0.3          # small-medium tree

  - shape: square
    center: [-1.5, -2.0]
    half_size: 0.4        # medium -- branch cluster

  # Narrow passage: ~1.2m edge-to-edge gap between these two, centered on
  # the original single-obstacle scenario's location.
  - shape: circle
    center: [0.9, -1.0]
    radius: 0.15
  - shape: circle
    center: [-0.6, -0.6]
    radius: 0.2

  - shape: circle
    center: [1.8, 0.5]
    radius: 0.25          # small tree

  - shape: square
    center: [-1.8, 1.5]
    half_size: 0.3         # medium

  - shape: circle
    center: [0.3, 3.0]
    radius: 0.2           # small tree

  - shape: circle
    center: [-1.2, 4.5]
    radius: 0.35          # medium tree

  - shape: circle
    center: [1.0, 6.0]
    radius: 0.2           # small tree

# Leader path: no avoidance logic of its own (see design_decisions.md), so
# it has to already clear every obstacle above by construction -- same
# authoring effort as placing them. Two deliberate detours: through the
# narrow passage (the two closely-spaced circles around y=-1..-0.6), and
# around the tree at (0.3, 3.0).
leader:
  t_end: 14.0
  waypoints:
    - [0.0, -6.0]
    - [0.0, -3.0]
    - [0.15, -0.8]   # thread the narrow passage
    - [0.0, 1.0]
    - [-0.3, 3.0]    # dodge the tree at (0.3, 3.0)
    - [0.0, 4.5]
    - [0.0, 6.0]
    - [0.0, 8.0]
  # (t, speed) keyframes, linearly interpolated -- accelerate from rest,
  # cruise, slow through each detour, decelerate to a stop. Cruise/slow
  # magnitudes picked, then uniformly scaled, so the profile's
  # time-integral roughly matches the waypoints' total length (~14.06m)
  # over t_end -- see design_decisions.md for the arithmetic.
  speed_profile:
    - [0.0, 0.0]     # start at rest
    - [1.5, 1.6]     # accelerate to cruise
    - [4.0, 1.6]     # cruise
    - [5.0, 0.6]     # slow for the narrow passage
    - [6.5, 0.6]
    - [8.0, 1.6]     # back to cruise
    - [9.5, 0.7]     # slow for the tree dodge
    - [10.5, 0.7]
    - [12.0, 1.6]    # cruise to the end
    - [13.0, 0.5]    # decelerate
    - [14.0, 0.0]    # stop

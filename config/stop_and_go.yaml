# Scenario: Stop-and-Go -- a straight line with no obstacles, isolating the
# motion-profile question from obstacle interaction: accelerate, cruise, come
# to a full stop, hold, then accelerate again (the Skydio "person runs, stops,
# then moves again" case). Tests whether a sudden-stop/sudden-restart demand
# alone -- independent of any avoidance cost -- reproduces the kind of
# transient seen at t=0 of other scenarios (see design_decisions.md's "RTI
# cold-start bootstrap" investigation), or whether it's specific to starting
# from rest.
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
obstacles: []

leader:
  # NOTE: speed_profile's time-integral must match waypoints' total path
  # length (16.0m here), or the leader runs out of path before the
  # profile's planned deceleration and the spline clamps to an abrupt,
  # uncommanded stop -- which then shows up as a huge spurious
  # acceleration spike in any derivative of the logged position. Caught
  # via scripts/run_scenario_suite.py's target_accel stats showing 16
  # m/s^2; see design_decisions.md's "Path-length / speed-profile
  # mismatch" for the full story and which scenarios were affected.
  t_end: 13.8
  waypoints:
    - [0.0, -6.0]
    - [0.0, 10.0]
  speed_profile:
    - [0.0, 0.0]      # start at rest
    - [1.5, 1.8]      # accelerate to cruise
    - [5.0, 1.8]      # cruise
    - [6.0, 0.0]      # hard stop
    - [8.0, 0.0]      # hold stopped
    - [9.5, 1.8]       # accelerate again, mid-scenario
    - [12.3, 1.8]      # cruise
    - [13.3, 0.3]
    - [13.8, 0.0]     # decelerate to a stop

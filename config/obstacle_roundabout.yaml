# Scenario: Obstacle Roundabout -- replaces high_curvature.yaml, which
# became redundant once fixed (clean PASS, and serpentine_clutter /
# sharp_corner / compound_stress already cover curvature-plus-avoidance
# combinations it isolated). This tests something none of the other 15
# scenarios do: commitment under ambiguity. A packed 2x2 cluster of
# overlapping obstacles (no gaps to thread, forcing a real "go around")
# sits at the center of a full 360-degree loop the jogger commits to and
# completes, returning to the same point it entered -- a roundabout, not
# a one-way dodge. The question this is designed to surface: does the
# MPC's avoidance cost commit cleanly to one side of the cluster and
# track the loop, or does the drone stall/oscillate hunting for a
# direction when the target is roughly opposite it across the cluster,
# where the local avoidance gradient is closest to symmetric? See
# design_decisions.md for the geometric reasoning and docs/
# roundabout_concept.png for the original sketch.
#
# NOTE: a straight vertical approach cannot be tangent to a circle
# centered on that same vertical line -- it always meets the circle
# radially (a 90-degree kink), the same C0-kink lesson as every other
# fixed scenario this session (see "Motion-generator module is
# piecewise-linear geometry, not a real curve"). Fixed at the geometry
# level, not by rounding after the fact: the loop is centered at
# (R_loop, cluster_y) instead of directly on the approach line, so the
# approach's entry point is the circle's LEFTMOST point, where the
# tangent is naturally vertical -- a genuinely smooth, kink-free entry
# and exit with no patching needed. Verified via
# scripts/test_motion_profile.py: vector-accel max 1.28 m/s^2, scalar
# 0.90 m/s^2 -- clean.
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
obstacles:
  - shape: circle
    center: [1.2, 3.7]
    radius: 0.5
  - shape: circle
    center: [2.0, 3.7]
    radius: 0.5
  - shape: circle
    center: [1.2, 4.4]
    radius: 0.5
  - shape: circle
    center: [2.0, 4.4]
    radius: 0.5


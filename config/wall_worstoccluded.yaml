# Scenario: Wall Slow-Down, Worst-Occluded variant -- same leader path as
# wall_slowdown.yaml (untouched: already validated there, see that
# file's NOTE on corner-filleting), but the wall is made bigger (3.6m x
# 3.6m instead of 3m x 3m, same center) so the drone->target sightline
# is fully blocked at the worst point instead of wall_slowdown.yaml's
# partial ~84% max.
#
# Tried shifting the wall sideways first (off-center from the leader's
# original straight-line path, toward the gap between the drone's lagged
# trailing line and the leader's detour) -- that DID push occlusion
# toward 100%, but it also pulled the DRONE itself closer to the wall
# (clearance_true down to ~0.29m, 1.5mm above the real collision radius,
# the same razor-thin near-miss margin seen on serpentine_clutter) --
# the opposite of what this variant is for. Growing the wall in place
# instead (same center, bigger half_size) hits 100% occlusion without
# that cost: at half_size=1.8, clearance_true's minimum is 0.304m (14mm
# above the real collision radius, same comfortable margin
# wall_slowdown.yaml itself has) and body_rate_magnitude_max_deg_s is
# 127.9 deg/s -- identical to wall_slowdown.yaml's own baseline, i.e.
# the drone's own flight stays exactly as calm as before. Swept
# half_size 1.6/1.7/1.75/1.8: only 1.8 lands on full (100.0%) max
# occlusion AND keeps clearance_true comfortable -- 1.75 also hits 100%
# but drone clearance drops back to the same thin 0.29m margin, so 1.8
# is the one actually wanted, not just the first one that reached 100%.
# See design_decisions.md's "wall_worstoccluded -- tuned for a near-
# total camera block, without re-introducing the drone wobble" entry.
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
obstacles:
  - shape: square
    center: [0.0, 3.0]
    half_size: 1.8          # bigger wall (3.6m x 3.6m), same center as wall_slowdown.yaml


# Scenario: Compound Stress -- a narrow passage AND a sharp turn, taken at
# full cruise speed with no deliberate slowdown through either. The existing
# curated scenarios each isolate one stressor (wall_slowdown.yaml: a big
# slow-closing obstacle; sharp_corner.yaml: a fast turn; forest.yaml: a
# narrow gap, but taken slowly) -- this combines geometry tightness, heading
# change, and speed simultaneously, which is where a cost-weight tradeoff
# that looks fine in isolation can still fight itself.
#
# NOTE: a straight-line check of the waypoints against the obstacles said
# ~0.5m clearance, but the realized spline (argus_follower::waypointTarget)
# cut that down to 0.038m -- the sharp turn immediately after the gap
# pulls the spline's tangent sideways *through* the gap, not just along
# it. Fixed by widening the gap AND adding a short straight buffer
# waypoint between the gap and the turn so the spline has room to
# straighten out first -- verified against the logged fx/fy afterward, see
# design_decisions.md's "Scenario validation must check the realized
# spline, not just waypoints."
#
# NOTE 2: the turn itself was still a single-vertex C0 kink (same bug
# class as high_curvature.yaml's original zigzag). Fixed with
# scripts/test_motion_profile.py's round_waypoints() helper, then
# re-stretched the cruise segment to match the new path length.
# target_accel_abs_max dropped from 2.33 to ~1.40 m/s^2.
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
obstacles:
  - shape: circle
    center: [-1.1, 4.0]
    radius: 0.4
  - shape: circle
    center: [1.1, 4.3]
    radius: 0.4

leader:
  t_end: 10.9560
  waypoints:
    - [0.0000, -6.0000]
    - [0.0000, 3.5000]
    - [0.0000, 4.1500]
    - [0.0000, 4.8717]
    - [0.0053, 4.9441]
    - [0.0209, 5.0149]
    - [0.0467, 5.0828]
    - [0.0820, 5.1461]
    - [0.1261, 5.2037]
    - [0.1781, 5.2544]
    - [0.2369, 5.2969]
    - [0.3012, 5.3305]
    - [2.9049, 6.4588]
    - [2.9691, 6.4815]
    - [3.0357, 6.4954]
    - [3.1037, 6.5000]
    - [6.0000, 6.5000]
  # Cruise speed held through BOTH the passage and the turn -- no slowdown
  # anywhere, the point of this scenario.
  speed_profile:
    - [0.0000, 0.0000]
    - [1.3000, 1.8000]
    - [9.4560, 1.8000]
    - [10.4560, 0.4000]
    - [10.9560, 0.0000]

# Scenario: Narrow Passage + Deep Orbit -- the leader squeezes through a
# sustained double-sided corridor (walls on both sides, not a single
# obstacle to dodge like every other scenario), goes deep inside to a
# still-pinched chamber, executes a tight loop around an obstacle sitting
# there, stops briefly right where it entered (flanked tightly on both
# sides at that instant), then reverses and retraces the same corridor
# back out. See docs/narrow_passage_deep_orbit_concept.png for the
# original sketch and design_decisions.md for the geometric reasoning.
#
# Combines three things no other scenario in this suite does together:
# sustained double-sided confinement (the approach corridor), a genuinely
# tight orbit (0.85m radius, pinched by chamber walls on both sides, not
# open like obstacle_roundabout.yaml's 1.6m loop in open space), and a
# there-and-back structure (the drone has to reverse its own committed
# direction, not just continue through).
#
# NOTE: a straight approach can never be tangent to a loop centered on
# the same line (the same lesson as obstacle_roundabout.yaml, hit again
# here). Fixed the same way: the loop is centered at (R_loop, chamber_y)
# instead of directly on the approach line (x=0), so the entry point is
# the loop's leftmost point, naturally tangent. A second, new wrinkle:
# a loop that returns to its own entry point and then reverses direction
# to retrace its way out cannot avoid a velocity-direction conflict at
# that instant by geometry alone (the tangent at a point on a closed
# curve is the same whether arriving or about to leave on another lap) --
# resolved with the same technique as target_reversal.yaml's fix: bring
# the leader to a smooth stop exactly as the loop closes (arc-length-
# derived, not guessed), then reverse from rest, so there's no
# instantaneous flip, just a deliberate pause. Verified via
# scripts/test_motion_profile.py: vector-accel max only 2.06 m/s^2,
# scalar 1.58 m/s^2 -- clean, no patching needed either time.
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
obstacles:
  - shape: square
    center: [-1.1, 2.5]
    half_size: 0.5
  - shape: square
    center: [1.1, 2.5]
    half_size: 0.5
  - shape: square
    center: [-1.1, 3.4]
    half_size: 0.5
  - shape: square
    center: [1.1, 3.4]
    half_size: 0.5
  - shape: square
    center: [-0.9, 5.3]
    half_size: 0.5
  - shape: square
    center: [2.6, 5.3]
    half_size: 0.5
  - shape: circle
    center: [0.85, 5.3]
    radius: 0.45


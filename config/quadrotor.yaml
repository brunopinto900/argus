# Quadrotor physical model parameters
model:
  mass:    1.0     # total mass [kg]
  gravity: 9.81    # gravitational acceleration [m/s²]
  Ix:      0.01    # roll  inertia [kg·m²]
  Iy:      0.01    # pitch inertia [kg·m²]
  Iz:      0.02    # yaw   inertia [kg·m²]

# MPC horizon settings
mpc:
  N:              20    # prediction horizon steps
  Ts:             0.05  # sample time [s]  →  look-ahead = N × Ts = 0.5 s
  hover_altitude: 1.5   # drone's desired flight altitude [m] (independent of target height)

# Input and state constraints
constraints:
  T_min:         0.0   # minimum thrust [N]
  T_max_factor:  2.0   # T_max = T_max_factor × T_hover
  rate_max:      5.0   # max roll/pitch rate command ±rate_max [rad/s]
  yaw_rate_max:  2.0   # max yaw rate command ±yaw_rate_max [rad/s]
  angle_max_deg: 60.0  # max roll / pitch [deg]  (keeps away from gimbal-lock at ±90°)

# Inner-loop (attitude rate controller) time constants — first-order approximation
# of the PX4 second-order rate controller.  tau = 1/wn:
#   roll/pitch: wn ≈ 25 rad/s  →  tau_rp  = 0.04 s
#   yaw:        wn ≈  4 rad/s  →  tau_yaw = 0.25 s
inner_loop:
  tau_rp:  0.04   # roll/pitch rate time constant [s]
  tau_yaw: 0.25   # yaw rate time constant [s]

# Cost weights (NONLINEAR_LS: min Σ ‖h(x,u) − yref‖²_W)
# W_stage layout:    [x, y, z,  vx, vy, vz,  phi, theta,  r_fov, r_obs,  T, p_cmd, q_cmd, r_cmd]
# W_terminal layout: [x, y, z,  vx, vy, vz,  phi, theta,  r_fov_e, r_obs_e]
# r_fov = softplus(cos(alpha) - cos(gamma)) — zero inside the FOV cone, grows outside.
# r_obs = max(0, d_safe - d_lin) — see obstacle_avoidance: below.
cost:
  W_stage:    [100.0, 100.0, 100.0,  10.0, 10.0, 10.0,  5.0, 5.0,  100.0, 100.0,  0.1, 0.1, 0.1, 0.1]
  W_terminal: [200.0, 200.0, 200.0,  20.0, 20.0, 20.0,  10.0, 10.0,  50.0, 100.0]

# Camera model: forward-facing (body +x axis), circular FOV cone
camera:
  fov_half_angle_deg: 40.0  # cone half-angle [deg] — must match FRUSTUM_H_FOV in animate_xy.py
  softplus_beta:       5.0  # sharpness of softplus transition (higher = closer to hard max)

# Plant simulator: second-order body-rate dynamics (matches PX4 inner loop).
# Intentionally different from the first-order MPC prediction model —
# the mismatch is the robustness test.  Set wn/zeta to match your hardware.
plant:
  wn_rp:    25.0   # roll/pitch rate bandwidth [rad/s]
  zeta_rp:   0.7   # roll/pitch damping ratio
  wn_yaw:    4.0   # yaw rate bandwidth [rad/s]
  zeta_yaw:  0.7   # yaw damping ratio

# argus_follower::TrailerFollower — trailer-like leader-follower reference
# generator (argus_follower/, see its README/tests for the algorithm itself).
# Independent of the quadrotor OCP above; N/Ts happen to match mpc.N/mpc.Ts
# by default but are its own horizon, not read from the mpc: section.
trailer:
  distance_to_target: 2.0    # hitch distance between the target and the follower's goal point [m]
  heading_gain:        1.0   # lambda: how fast the follower's heading tracks the target's velocity direction
  N:                   20    # prediction horizon steps
  Ts:                   0.05 # sample time [s]
  # Design target for the camera's pitch bearing to the FOV target -- NOT 0,
  # the drone is meant to look down at a ground-level target from a standoff
  # altitude. z_ref = distance_to_target * tan(target_bearing_deg), see
  # examples/trailer_mpc_demo.cpp / online_mapping_demo.cpp's kFovZRef and
  # design_decisions.md's "Static FOV-aware z_ref". Headroom under
  # camera.fov_half_angle_deg (40 deg) is deliberate, not derived.
  target_bearing_deg: 30.0

# argus_perception::simulateLidarScan — synthetic 360° mapping sensor
# ("a bunch of cameras + lidars"), separate from camera: above, which
# stays dedicated to target-pointing only and does not feed the map — see
# design_decisions.md's "Two-camera model". Not yet read by any demo
# (argus_perception has no yaml-cpp dependency itself, same as
# argus_follower) — wire this up when the online-mapping sim loop lands.
mapping_sensor:
  max_range_m:    8.0    # realistic dense-depth range for the OAK-D-Lite referenced in ros2/argus_px4_bridge
  num_rays:       1006   # ceil(2*pi * max_range_m / voxel_size), voxel_size=0.05m — see design_decisions.md
  update_rate_hz: 60.0   # matches real camera fps; decoupled from mpc.Ts (the 20Hz control loop)

# Collision-avoidance hinge cost: r_obs = max(0, d_safe - d_lin), where
# d_lin is a per-stage local affine reconstruction of own_map's ESDF
# (own_map.query() can't enter the OCP symbolically -- see whiteboard.md),
# injected as a runtime parameter alongside the FOV target. d_safe here is
# baked in at code-generation time (not a runtime parameter) since it's
# not expected to vary per solve. Its weight lives in cost.W_stage/
# W_terminal above (the r_obs entry), same convention as r_fov's weight --
# not duplicated here.
#
# Base value: d_safe_m = r_drone + delta_voxel + delta_stale =
# 0.15 + 0.05 + 0.07 = 0.27 -- see design_decisions.md's "d_safe -- first
# derived value" for how delta_stale was measured (logs/staleness_log.csv,
# one bypass scenario) and delta_voxel's reasoning. r_drone=0.15 is a
# placeholder (no actual drone physical size is defined anywhere in this
# repo) -- swap it for the real value.
#
# Inflated by 2.7x (= 0.27 / observed closest-approach at weight=100 from
# the r_obs weight sweep) to compensate for the squared-hinge cost's
# known undershoot: a finite soft-cost weight asymptotically approaches
# but never guarantees d_safe is actually respected (the penalty near
# the threshold stays small, unlike e.g. an exponential barrier) -- see
# design_decisions.md's "r_obs weight" sweep and its "cost vs constraint"
# discussion. This compensation is an empirical fit at weight=100 for ONE
# scenario, not a general correction -- needs a Monte Carlo sweep before
# trusting this in deployment, same as delta_stale above.
obstacle_avoidance:
  d_safe_m: 0.729

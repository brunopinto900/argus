# Scenario: Serpentine Clutter -- a sustained slalom through closely-spaced
# obstacles, alternating sides continuously (not forest.yaml's occasional
# dodge). Stresses smoothness/chattering continuously rather than at one
# isolated event, closer to how the softplus_beta chattering pathology
# actually showed up (see design_decisions.md's "softplus_beta weight
# sweep").
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
obstacles:
  - shape: circle
    center: [-1.0, -3.0]
    radius: 0.4
  - shape: circle
    center: [1.0, -1.0]
    radius: 0.4
  - shape: circle
    center: [-1.0, 1.0]
    radius: 0.4
  - shape: circle
    center: [1.0, 3.0]
    radius: 0.4
  - shape: circle
    center: [-1.0, 5.0]
    radius: 0.4

leader:
  t_end: 14.0
  waypoints:
    - [0.0, -6.0]
    - [1.0, -4.0]    # pass the right of the first obstacle
    - [-1.0, -2.0]   # pass the left of the second
    - [1.0, 0.0]     # pass the right of the third
    - [-1.0, 2.0]    # pass the left of the fourth
    - [1.0, 4.0]     # pass the right of the fifth
    - [0.0, 6.0]
    - [0.0, 8.0]
  # Cruise held through the whole slalom -- continuous weaving, not
  # occasional dodges, is the point.
  speed_profile:
    - [0.0, 0.0]      # start at rest
    - [1.5, 1.3]      # accelerate to cruise
    - [12.5, 1.3]     # cruise through the entire weave
    - [13.5, 0.4]
    - [14.0, 0.0]     # stop

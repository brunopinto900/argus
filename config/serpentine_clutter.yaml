# Scenario: Serpentine Clutter -- a sustained slalom through closely-spaced
# obstacles, alternating sides continuously (not forest.yaml's occasional
# dodge). Stresses smoothness/chattering continuously rather than at one
# isolated event, closer to how the softplus_beta chattering pathology
# actually showed up (see design_decisions.md's "softplus_beta weight
# sweep").
#
# NOTE: the original zigzag routed each lane-change through a single
# vertex -- the worst repeat offender of the C0-kink bug (same class as
# high_curvature.yaml's original zigzag): 5 sharp turns in one scenario,
# confirmed vector-accel spikes of ~18 m/s^2 at tick resolution. Fixed
# with scripts/test_motion_profile.py's round_waypoints() helper, then
# re-stretched the cruise segment to match the new path length.
# target_accel_abs_max dropped from 3.79 to ~0.90 m/s^2. (The true
# minimum clearance to the nearest obstacle, ~0.31m, is unchanged from
# before this fix -- it comes from the original straight-line waypoint
# geometry brushing an adjacent obstacle, not from the rounding.)
#
# shape: circle   -> center [x, y], radius
# shape: square   -> center [x, y], half_size
obstacles:
  - shape: circle
    center: [-1.0, -3.0]
    radius: 0.4
  - shape: circle
    center: [1.0, -1.0]
    radius: 0.4
  - shape: circle
    center: [-1.0, 1.0]
    radius: 0.4
  - shape: circle
    center: [1.0, 3.0]
    radius: 0.4
  - shape: circle
    center: [-1.0, 5.0]
    radius: 0.4

